name: Play Store (listing, release, reviews)

# Sends the store listing or a built bundle to Google Play, or only checks
# them — so the store entry no longer has to be typed in by hand, language by
# language (which is why it stood still from September to November 2026).
#
# Started by hand: Actions → "Play Store (listing, release, reviews)" →
# "Run workflow". The `check-…` actions change nothing: Google validates the
# edit and it is thrown away. `publish-listing` puts texts and images live;
# `draft-release` leaves a release in the Console ready to roll out — a
# person presses that button, never this workflow.
#
# Required repository secret:
#   PLAY_SERVICE_ACCOUNT_JSON   the full JSON key of a Google Cloud service
#                               account that the Play Console lets edit this
#                               app's store presence and releases
#                               (ANLEITUNG.md says what the owner has to do).
#
# Once a week it also prints the reviews of the last seven days into the run
# log (rating, text, language, version — never a name). Without the secret
# that run says so and stays green.

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          check-… changes nothing. publish-listing goes live. draft-release
          leaves a draft in the Console.
        type: choice
        options:
          - check-listing
          - publish-listing
          - check-release
          - draft-release
          - reviews
        default: check-listing
      part:
        description: 'Listing: texts, images or both'
        type: choice
        options:
          - both
          - texts
          - images
        default: both
      spain:
        description: 'Listing: also send the Spanish texts and images to Spanish (Spain)'
        type: boolean
        default: false
      other_images:
        description: >-
          Listing: the September screenshots of all other languages — keep
          them, or remove them so those languages show the English pictures
        type: choice
        options:
          - keep
          - remove
        default: keep
      ai_state:
        description: >-
          Listing images: Google's "generated by AI" attestation. Yours to
          decide — "unset" sends none.
        type: choice
        options:
          - unset
          - not-ai
          - ai
        default: unset
      build_run_id:
        description: >-
          Release: the run id of "Build Android Release (.aab)" (the number in
          that run's URL) whose PRODUCTION-ads bundle to upload
        type: string
        default: ''
  schedule:
    # Mondays, early. Off the full hour on purpose.
    - cron: '17 5 * * 1'

permissions:
  contents: read
  actions: read

# One edit at a time: two runs would each open an edit and the second commit
# would be refused.
concurrency:
  group: play-store
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action || 'reviews' }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the key there?
        id: key
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set — nothing to do (ANLEITUNG.md)."
            else
              echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set (ANLEITUNG.md)."
              exit 1
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEY" > "$RUNNER_TEMP/play-service-account.json"
            echo "PLAY_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: '3.12'

      # Pinned: tool/play_publish.py was checked against the API description
      # this exact version ships (revision 20261026). Bump deliberately, and
      # run the selftest when you do.
      - name: Install Google's API client
        if: steps.key.outputs.present == 'true'
        run: pip install --quiet google-api-python-client==2.202.0 google-auth

      - name: Selftest (no network)
        if: steps.key.outputs.present == 'true'
        run: python3 tool/play_publish.py selftest

      - name: Lay out the listings
        if: steps.key.outputs.present == 'true' && env.ACTION != 'reviews'
        env:
          SPAIN: ${{ inputs.spain }}
        run: |
          if [ "$SPAIN" = "true" ]; then
            python3 tool/export_play_metadata.py --with-copies
          else
            python3 tool/export_play_metadata.py
          fi

      - name: Listing
        if: >-
          steps.key.outputs.present == 'true' &&
          (env.ACTION == 'check-listing' || env.ACTION == 'publish-listing')
        env:
          PART: ${{ inputs.part }}
          AI_STATE: ${{ inputs.ai_state }}
          OTHER_IMAGES: ${{ inputs.other_images }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$ACTION" = "publish-listing" ]; then ARGS+=(--commit); fi
          if [ "$PART" = "texts" ]; then ARGS+=(--texts-only); fi
          if [ "$PART" = "images" ]; then ARGS+=(--images-only); fi
          if [ "$AI_STATE" != "unset" ]; then ARGS+=(--ai-state "$AI_STATE"); fi
          if [ "$OTHER_IMAGES" = "remove" ]; then ARGS+=(--clear-other-images); fi
          python3 tool/play_publish.py listing "${ARGS[@]}"

      # Only a bundle built with the real ad units has this artifact name
      # (build-release.yaml), so one built for testers cannot get here.
      - name: Fetch the bundle
        if: >-
          steps.key.outputs.present == 'true' &&
          (env.ACTION == 'check-release' || env.ACTION == 'draft-release')
        uses: actions/download-artifact@v4
        with:
          name: qubble-release-aab-PRODUCTION-ads
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: bundle

      - name: Release
        if: >-
          steps.key.outputs.present == 'true' &&
          (env.ACTION == 'check-release' || env.ACTION == 'draft-release')
        run: |
          set -euo pipefail
          ARGS=(--track production --status draft)
          if [ "$ACTION" = "draft-release" ]; then ARGS+=(--commit); fi
          python3 tool/play_publish.py release bundle/app-release.aab "${ARGS[@]}"

      - name: Reviews of the last week
        if: steps.key.outputs.present == 'true' && env.ACTION == 'reviews'
        run: python3 tool/play_publish.py reviews | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
